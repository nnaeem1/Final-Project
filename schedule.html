<!DOCTYPE html>
<html lang="en">
<head>
  <title> CampusLife | Weekly Schedule</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="./css/style.css"/>
</head>
<body>

  <div class="container mt-4">

    <header id="main_header">
      <div class="header-left">
        <h1> CampusLife</h1>
        <h2 class="lead">Weekly Schedule</h2>
      </div>
      <div class="header-right">
        Plan your week
      </div>
    </header>

    <nav id="main_nav">
      <a href="index.html" class="btn btn-outline-primary">Home</a>
      <a href="tasks.html" class="btn btn-outline-primary">Tasks</a>
      <a href="schedule.html" class="btn btn-primary">Schedule</a>
    </nav>

    <main id="main_content">

      <section id="schedule_section">
        <h2> Weekly Schedule</h2>
        
        <!-- A display of their schedule that shows what their week will look like according to the assignments that need to be completed and what class they need to attend -->
        <table class="schedule-table">
          <thead>
            <tr><th>Time</th><th>Monday</th><th>Tuesday</th><th>Wednesday</th><th>Thursday</th></tr>
          </thead>
          <tbody>
            <tr><td></td><td></td><td></td><td></td><td></td></tr>
            <tr><td></td><td></td><td></td><td></td><td></td></tr>
            <tr><td></td><td></td><td></td><td></td><td></td></tr>
            <tr><td></td><td></td><td></td><td></td><td></td></tr>
          </tbody>
        </table>
        
        <!-- Important events that the user needs to attend -->
        <div class="two-columns">
          <div class="info-box">
            <h3> Office Hours</h3>
            <p><br></p>
          </div>
          <div class="info-box">
            <h3> Study Group</h3>
            <p><br></p>
          </div>
        </div>
        
        <!-- Add buttons -->
        <div class="add-buttons">
          <button id="add_class_btn" class="btn btn-outline-secondary">+ Add Class</button>
          <button id="add_study_btn" class="btn btn-outline-secondary">+ Add Study Block</button>
        </div>
      </section>

    </main>

    <footer id="page_footer">
      <p> Next class: </p>
    </footer>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="./js/script.js"></script>
</body>
</html>
