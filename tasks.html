<!DOCTYPE html>
<html lang="en">
<head>
  <title> CampusLife | Task Hub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="./css/style.css"/>
</head>
<body>

  <div class="container mt-4">

    <header id="main_header">
      <div class="header-left">
        <h1>CampusLife</h1>
        <h2 class="lead">Task Hub</h2>
      </div>
      <div class="header-right">
        Stay on track
      </div>
    </header>

    <nav id="main_nav">
      <a href="index.html" class="btn btn-outline-primary">Home</a>
      <a href="tasks.html" class="btn btn-primary">Tasks</a>
      <a href="schedule.html" class="btn btn-outline-primary">Schedule</a>
    </nav>

    <main id="main_content">

      <section id="tasks_section">
        <h2>My Tasks</h2>
        
        <!-- Filter buttons that allow the user to see the assignemt by the same categories -->
        <div class="mood-buttons">
          <button class="filter-btn">All</button>
          <button class="filter-btn">Class</button>
          <button class="filter-btn">Exam</button>
          <button class="filter-btn">Project</button>
        </div>
        
        <!-- List of tasks that need to be completed -->
        <ul id="task_list" class="task-list-ul">
          <li class="task-item">
            <input type="checkbox" class="task-checkbox"> Essay - Due Friday
            <span class="badge-danger">3 days left</span>
          </li>
          <li class="task-item">
            <input type="checkbox" class="task-checkbox"> Math Homework - Due Thursday
            <span class="badge-warning">2 days left</span>
          </li>
          <li class="task-item">
            <input type="checkbox" class="task-checkbox"> Study for Midterm - Due 4/20
            <span class="badge-success">14 days left</span>
          </li>
        </ul>
        
        <!-- This allows the user to add a new task -->
        <div class="add-task-area">
          <input type="text" id="new_task_input" placeholder="New task name...">
          <button id="add_task_btn" class="btn btn-primary">+ Add Task</button>
        </div>
        
        <!-- Progress bar -->
        <div class="progress-area">
          <p>Weekly Progress: <span id="progress_count">0</span>/3 tasks done</p>
          <div class="progress-bar-container">
            <div id="progress_bar" class="progress-bar-fill" style="width: 0%">0%</div>
          </div>
        </div>
      </section>

    </main>

    <footer id="page_footer">
      <p>No progress yet!</p>
    </footer>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="./js/script.js"></script>
</body>
</html>
